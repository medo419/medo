<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Medo</title>

<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
:root {
    --bg-color: #0f172a;
    --card-bg: rgba(30, 41, 59, 0.7);
    --accent: #38bdf8;
    --text-main: #f1f5f9;
    --text-sec: #94a3b8;
    --glass-border: rgba(255, 255, 255, 0.1);
}

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Tajawal', sans-serif;
    -webkit-tap-highlight-color: transparent;
}

body {
    min-height: 100vh;
    background-color: var(--bg-color);
    background-image: 
        radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.15) 0%, transparent 40%),
        radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
}

canvas#snow {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
    z-index: 0;
    opacity: 0.3;
}

.card {
    position: relative;
    z-index: 2;
    width: 100%;
    max-width: 400px;
    background: var(--card-bg);
    backdrop-filter: blur(20px);
    border: 1px solid var(--glass-border);
    border-radius: 30px;
    padding: 40px 25px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
    animation: floatUp 0.8s ease-out;
}

.profile-container {
    position: relative;
    display: inline-block;
    margin-bottom: 20px;
}

.profile-img {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid rgba(255,255,255,0.1);
    box-shadow: 0 0 30px rgba(56,189,248,0.3);
    transition: transform 0.3s;
}

.profile-img:hover {
    transform: scale(1.05) rotate(3deg);
}

.status-badge {
    position: absolute;
    bottom: 5px;
    right: 5px;
    background: #10b981;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 3px solid var(--card-bg);
}

h1 {
    color: var(--text-main);
    font-size: 2rem;
    font-weight: 800;
    margin-bottom: 5px;
}

.bio {
    color: var(--text-sec);
    margin-bottom: 30px;
    display: flex;
    justify-content: center;
    gap: 8px;
}

.links-container {
    display: flex;
    flex-direction: column;
    gap: 12px;
}

.btn {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(255,255,255,0.03);
    border: 1px solid rgba(255,255,255,0.05);
    padding: 16px 20px;
    border-radius: 18px;
    color: var(--text-main);
    text-decoration: none;
    transition: 0.3s;
}

.btn:hover {
    background: rgba(255,255,255,0.1);
    transform: translateY(-2px);
    border-color: var(--accent);
}

.btn-content {
    display: flex;
    align-items: center;
    gap: 15px;
}

.btn i {
    width: 25px;
    text-align: center;
}

/* الألوان */
.btn-sileo i { color: #38bdf8; }
.btn-twitter i { color: #1da1f2; }
.btn-github i { color: #ffffff; }
.btn-snapchat i { color: #fffc00; }

.btn-more {
    cursor: pointer;
    background: rgba(56,189,248,0.1);
}

.hidden-content {
    max-height: 0;
    overflow: hidden;
    transition: 0.5s;
    opacity: 0;
}

.hidden-content.active {
    max-height: 300px;
    opacity: 1;
    margin-top: 15px;
}

.footer {
    margin-top: 30px;
    font-size: 0.8rem;
    color: var(--text-sec);
}

@keyframes floatUp {
    from {opacity:0; transform:translateY(30px);}
    to {opacity:1; transform:translateY(0);}
}
</style>
</head>

<body>

<canvas id="snow"></canvas>

<div class="card">

<div class="profile-container">
<img src="CydiaIcon.png" class="profile-img">
<div class="status-badge"></div>
</div>

<h1>Medo</h1>

<div class="bio">
<i class="fa-solid fa-code"></i> Systems & Apps
</div>

<div class="links-container">

<a href="sileo://source/https://medo419.github.io/medo/" class="btn btn-sileo">
<div class="btn-content">
<i class="fa-solid fa-box-open"></i>
<span>Add to Sileo</span>
</div>
<i class="fa-solid fa-chevron-right"></i>
</a>

<a href="https://x.com/ei_6m?s=21" class="btn btn-twitter">
<div class="btn-content">
<i class="fa-brands fa-twitter"></i>
<span>Twitter</span>
</div>
<i class="fa-solid fa-chevron-right"></i>
</a>

<!-- 👇 سناب يفتح التطبيق -->
<a href="javascript:void(0)" class="btn btn-snapchat" onclick="openSnap()">
<div class="btn-content">
<i class="fa-brands fa-snapchat"></i>
<span>Snapchat</span>
</div>
<i class="fa-solid fa-chevron-right"></i>
</a>

<a href="https://github.com/medo419" class="btn btn-github">
<div class="btn-content">
<i class="fa-brands fa-github"></i>
<span>Github</span>
</div>
<i class="fa-solid fa-chevron-right"></i>
</a>

</div>

<div class="footer">
© 2016-2026 Medo
</div>

</div>

<script>
function openSnap() {
    window.location.href = "snapchat://add/USERNAME";

    setTimeout(() => {
        window.location.href = "https://snapchat.com/add/ei_5m";
    }, 1500);
}
</script>

</body>
</html>
