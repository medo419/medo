<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Medo | عالم المستقبل</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap');
    :root {
      --primary: #0ff;
      --secondary: #f0f;
      --dark: #111;
      --darker: #000;
      --neon-glow: 0 0 10px var(--primary), 0 0 20px var(--primary), 0 0 30px var(--primary);
      --neon-pink-glow: 0 0 10px var(--secondary), 0 0 20px var(--secondary);
      --scan-line: linear-gradient(
        to bottom,
        transparent 95%,
        rgba(0, 255, 255, 0.1) 96%,
        transparent 97%
      );
    }
    * {
      margin: 0; padding: 0; box-sizing: border-box;
      font-family: 'Tajawal', sans-serif;
    }
    body {
      background-color: var(--darker);
      color: white;
      overflow-x: hidden;
      position: relative;
      min-height: 100vh;
      background-image: var(--scan-line),
        radial-gradient(circle at 20% 30%, rgba(0,255,255,0.03) 0%, transparent 20%),
        radial-gradient(circle at 80% 70%, rgba(255,0,255,0.03) 0%, transparent 20%);
      background-attachment: fixed;
      background-size: 100% 30px;
    }
    body::before {
      content: "";
      position: fixed;
      top:0; left:0; width: 100%; height: 100%;
      background: url('https://placehold.co/1920x1080/111111/0ff?text=MEDO+WORLD&font=monospace') center/cover no-repeat;
      opacity: 0.1; z-index: -1;
    }
    .container {
      max-width: 1200px; margin: 0 auto; padding: 20px; position: relative;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 20px 0; border-bottom: 1px solid rgba(0,255,255,0.3);
      margin-bottom: 30px;
    }
    .logo {
      display: flex; align-items: center; gap: 15px; position: relative;
    }
    .cyber-eye {
      width: 50px; height: 50px; filter: drop-shadow(var(--neon-glow));
      transition: transform 0.3s;
    }
    .eye-outer {
      fill: none; stroke: var(--primary); stroke-width: 2;
    }
    .eye-inner {
      fill: var(--primary); animation: pulse 2s infinite;
    }
    .eye-cross {
      stroke: var(--primary); stroke-width: 1; stroke-linecap: round;
    }
    .main-content {
      text-align: center; padding: 30px 0; position: relative;
    }
    h1.cyber-glitch {
      font-size: 4rem; font-weight: 900;
      color: var(--primary); text-shadow: var(--neon-glow);
      margin-bottom: 20px; position: relative;
      animation: glitch-text 2s infinite alternate;
    }
    .cyber-subtitle {
      font-size: 1.5rem; color: white; margin-bottom: 40px;
      text-shadow: 0 0 5px rgba(255,255,255,0.7); position: relative;
    }
    .cyber-subtitle::after {
      content: '';
      display: block; width: 50px; height: 3px;
      background: var(--primary);
      margin: 15px auto;
      box-shadow: var(--neon-glow);
    }
    .social-links {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 20px; margin: 40px 0;
    }
    .cyber-button {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      padding: 15px 25px;
      color: white; text-decoration: none;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--primary);
      border-radius: 3px;
      overflow: hidden;
      transition: all 0.3s;
      z-index: 1;
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
      cursor: pointer;
    }
    .cyber-button:hover {
      background: rgba(0,255,255,0.1);
      box-shadow: var(--neon-glow);
      transform: translateY(-3px);
    }
    .cyber-button__tag {
      position: absolute; left: 10px; top: 10px;
      font-size: 0.8rem;
      color: var(--primary);
      background: rgba(0,0,0,0.5);
      padding: 2px 5px;
      border-radius: 2px;
    }
    .cyber-button__glitch {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(45deg, var(--primary) 0%, var(--secondary) 50%, var(--primary) 100%);
      opacity: 0; z-index: -1;
      transition: opacity 0.3s;
    }
    .cyber-button:hover .cyber-button__glitch {
      opacity: 0.1;
    }
    .cyber-terminal {
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--primary);
      border-radius: 5px;
      margin: 40px 0;
      overflow: hidden;
      box-shadow: 0 0 15px rgba(0,255,255,0.2);
    }
    .terminal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 15px;
      background: rgba(0,255,255,0.1);
      border-bottom: 1px solid var(--primary);
    }
    .terminal-title {
      color: var(--primary);
      font-weight: bold;
      text-shadow: 0 0 5px var(--primary);
    }
    .terminal-controls {
      display: flex;
      gap: 8px;
    }
    .control {
      width: 12px; height: 12px;
      border-radius: 50%;
      background: #ff5f56;
      cursor: pointer;
    }
    .control:nth-child(2) {
      background: #ffbd2e;
    }
    .control:nth-child(3) {
      background: #27c93f;
    }
    .terminal-content {
      padding: 20px;
      min-height: 200px;
      position: relative;
    }
    .matrix-text {
      font-family: monospace;
      font-size: 16px;
      line-height: 1.5;
      color: var(--primary);
      text-shadow: 0 0 5px var(--primary);
    }
    .cyber-footer {
      margin-top: 50px;
      padding: 20px 0;
      border-top: 1px solid rgba(0,255,255,0.3);
      text-align: center;
      position: relative;
    }
    .cyber-warning {
      background: rgba(255,0,0,0.1);
      border: 1px solid rgba(255,0,0,0.3);
      padding: 10px;
      border-radius: 3px;
      animation: warning-pulse 2s infinite;
    }
    .warning-text {
      color: #ff3366;
      display: block;
      font-weight: bold;
      margin-bottom: 5px;
    }
    .warning-code {
      color: var(--primary);
      font-size: 0.9rem;
      font-family: monospace;
    }
    @keyframes pulse {
      0% { opacity: 0.7; }
      50% { opacity: 1; }
      100% { opacity: 0.7; }
    }
    @keyframes glitch-text {
      0% { text-shadow: 0 0 10px var(--primary); }
      20% { text-shadow: -2px -2px 10px var(--primary), 2px 2px 10px var(--secondary); }
      40% { text-shadow: 2px -2px 10px var(--primary), -2px 2px 10px var(--secondary); }
      60% { text-shadow: -2px 0 10px var(--secondary), 2px 0 10px var(--primary); }
      80% { text-shadow: 0 -2px 10px var(--primary), 0 2px 10px var(--secondary); }
      100% { text-shadow: 0 0 10px var(--primary); }
    }
    @keyframes warning-pulse {
      0% { box-shadow: 0 0 5px rgba(255,0,0,0.3); }
      50% { box-shadow: 0 0 15px rgba(255,0,0,0.5); }
      100% { box-shadow: 0 0 5px rgba(255,0,0,0.3); }
    }
    .matrix-rain {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      z-index: -2; pointer-events: none;
    }
    @media (max-width: 768px) {
      h1.cyber-glitch {
        font-size: 2.5rem;
      }
      .cyber-subtitle {
        font-size: 1.2rem;
      }
      .social-links {
        grid-template-columns: 1fr;
      }
      .terminal-content {
        min-height: 150px;
      }
    }
  </style>
</head>
<body>
  <div class="matrix-rain"></div>
  <div class="container">
    <main class="content">
      <header class="header">
        <div class="logo">
          <svg class="cyber-eye" viewBox="0 0 24 24">
            <circle cx="12" cy="12" r="10" class="eye-outer"></circle>
            <circle cx="12" cy="12" r="4" class="eye-inner"></circle>
            <path d="M12 7v10M7 12h10" class="eye-cross"></path>
          </svg>
        </div>
      </header>
      <section class="main-content">
        <h1 class="cyber-glitch" data-text="Medo">Medo</h1>
        <p class="cyber-subtitle">لا شيء هنا صدفة, حتى وجودك..!</p>
        <nav class="social-links">
          <a href="https://snapchat.com/t/t3TpdQ0v" class="cyber-button" target="_blank" onclick="playClick()">
            <span class="cyber-button__glitch"></span>
            <span class="cyber-button__tag">SC</span>
            <span class="cyber-button__text">سناب شات</span>
          </a>
          <a href="https://www.instagram.com/me_do6231?igsh=ZWplMGZsN2ZsbTg4&utm_source=qr" class="cyber-button" target="_blank" onclick="playClick()">
            <span class="cyber-button__glitch"></span>
            <span class="cyber-button__tag">IG</span>
            <span class="cyber-button__text">انستغرام</span>
          </a>
          <a href="https://t.me/ei_5m" class="cyber-button" target="_blank" onclick="playClick()">
            <span class="cyber-button__glitch"></span>
            <span class="cyber-button__tag">TG</span>
            <span class="cyber-button__text">تيليجرام</span>
          </a>
          <a href="https://x.com/ei_6m?s=21" class="cyber-button" target="_blank" onclick="playClick()">
            <span class="cyber-button__glitch"></span>
            <span class="cyber-button__tag">TW</span>
            <span class="cyber-button__text">تويتر</span>
          </a>
          <a href="sileo://source/https://medo419.github.io/medo/" class="cyber-button" target="_blank" onclick="playClick()">
            <span class="cyber-button__glitch"></span>
            <span class="cyber-button__tag">Sileo</span>
            <span class="cyber-button__text">اضافة السورس للسيلو</span>
          </a>
          <!-- زر أدوات Medo -->
          <a href="tools.html" class="cyber-button">
            <span class="cyber-button__glitch"></span>
            <span class="cyber-button__tag">Tools</span>
            <span class="cyber-button__text">أدوات Medo</span>
          </a>
        </nav>
        <div class="cyber-terminal">
          <div class="terminal-header">
            <span class="terminal-title">SYSTEM://STATUS</span>
            <div class="terminal-controls">
              <span class="control"></span>
              <span class="control"></span>
              <span class="control"></span>
            </div>
          </div>
          <div class="terminal-content">
            <div class="matrix-text"></div>
          </div>
        </div>
      </section>
      <footer class="cyber-footer">
        <div class="cyber-warning">
          <span class="warning-text">SYSTEM_BREACH_DETECTED</span>
          <span class="warning-code">ERR_0x00F2: Reality_Malfunction</span>
        </div>
      </footer>
    </main>
  </div>
  <audio id="clickSound" src="https://www.soundjay.com/button/beep-07.wav" preload="auto"></audio>
  <script>
    function playClick() {
      const sound = document.getElementById('clickSound');
      if(sound) {
        sound.currentTime = 0;
        sound.play();
      }
    }
    // Matrix Rain Effect
    const matrixRain = document.querySelector('.matrix-rain');
    const matrixText = document.querySelector('.matrix-text');
    const chars = "01";
    const fontSize = 16;
    let columns = Math.floor(window.innerWidth / fontSize);
    let drops = [];
    function initMatrix() {
      columns = Math.floor(document.querySelector('.container').offsetWidth / fontSize);
      matrixRain.innerHTML = '';
      drops = [];
      const canvas = document.createElement('canvas');
      canvas.width = document.querySelector('.container').offsetWidth;
      canvas.height = window.innerHeight;
      canvas.style.width = '100%';
      canvas.style.height = '100%';
      matrixRain.appendChild(canvas);
      const ctx = canvas.getContext('2d');
      ctx.font = `${fontSize}px monospace`;
      for(let i=0;i<columns;i++) {
        drops[i] = 1;
      }
      function draw() {
        ctx.fillStyle = 'rgba(0,0,0,0.05)';
        ctx.fillRect(0,0,canvas.width,canvas.height);
        ctx.fillStyle = '#0f0';
        for(let i=0;i<drops.length;i++) {
          const text = chars[Math.floor(Math.random()*chars.length)];
          ctx.fillText(text,i*fontSize,drops[i]*fontSize);
          if(drops[i]*fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
      }
      setInterval(draw,33);
    }
    // Terminal Effect
    const terminalMessages = [
      "تشغيل النظام...",
      "تحميل الوحدات...",
      "جاري التحقق من الأمن...",
      "تم الكشف عن 3 تهديدات إلكترونية",
      "تشغيل نظام الحماية...",
      "مرحبًا بك في النظام ، Medo",
      "الحالة: نشط",
      "الوصول: مسموح",
      "التهديدات: منخفضة"
    ];
    function typeTerminalText() {
      let i = 0, line = 0, currentMessage = '', deleting = false;
      function writeText() {
        if(line < terminalMessages.length){
          if(!deleting){
            if(i <= terminalMessages[line].length){
              currentMessage = terminalMessages[line].substring(0,i);
              matrixText.textContent = currentMessage + (i < terminalMessages[line].length ? '█' : '');
              i++;
              setTimeout(writeText, Math.random() * 50 + 50);
            } else {
              deleting = true;
              setTimeout(writeText, 1000);
            }
          } else {
            if(i >= 0){
              currentMessage = terminalMessages[line].substring(0,i);
              matrixText.textContent = currentMessage + (i > 0 ? '█' : '');
              i--;
              setTimeout(writeText, 30);
            } else {
              deleting = false;
              line++;
              setTimeout(writeText, 500);
            }
          }
        } else {
          line = 0;
          setTimeout(writeText, 500);
        }
      }
      writeText();
    }
    window.onload = () => {
      initMatrix();
      typeTerminalText();
      window.addEventListener('resize', initMatrix);
    }
  </script>
</body>
</html>
