<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>أدوات Medo | عالم المستقبل</title>
  <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --primary: #0ff;
      --secondary: #f0f;
      --dark: #111;
      --darker: #000;
      --neon-glow: 0 0 10px var(--primary), 0 0 20px var(--primary), 0 0 30px var(--primary);
    }
    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }
    body {
      background-color: var(--darker);
      color: white;
      min-height: 100vh;
      background-image: linear-gradient(to bottom, transparent 95%, rgba(0,255,255,0.1) 96%, transparent 97%),
        radial-gradient(circle at 20% 30%, rgba(0,255,255,0.03) 0%, transparent 20%),
        radial-gradient(circle at 80% 70%, rgba(255,0,255,0.03) 0%, transparent 20%);
      background-attachment: fixed;
      background-size: 100% 30px;
    }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }

    h1 {
      text-align: center;
      font-size: 3rem;
      color: var(--primary);
      text-shadow: var(--neon-glow);
      margin: 40px 0 20px;
      animation: glitch-text 2s infinite alternate;
    }
    @keyframes glitch-text {
      0% { text-shadow: 0 0 10px var(--primary); }
      20% { text-shadow: -2px -2px 10px var(--primary), 2px 2px 10px var(--secondary); }
      40% { text-shadow: 2px -2px 10px var(--primary), -2px 2px 10px var(--secondary); }
      60% { text-shadow: -2px 0 10px var(--secondary), 2px 0 10px var(--primary); }
      80% { text-shadow: 0 -2px 10px var(--primary), 0 2px 10px var(--secondary); }
      100% { text-shadow: 0 0 10px var(--primary); }
    }

    .tools-list {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
      gap: 20px;
      margin-top: 30px;
    }

    .cyber-button {
      position: relative;
      display: flex; align-items: center; justify-content: center;
      padding: 15px 20px;
      color: white; text-decoration: none;
      background: rgba(0,0,0,0.7);
      border: 1px solid var(--primary);
      border-radius: 3px;
      overflow: hidden;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
      cursor: pointer;
      text-align: center;
      font-size: 1.2rem;
    }

    .cyber-button:hover {
      background: rgba(0,255,255,0.1);
      box-shadow: var(--neon-glow);
      transform: translateY(-3px);
    }

    .cyber-button__tag {
      position: absolute; left: 10px; top: 10px;
      font-size: 0.8rem;
      color: var(--primary);
      background: rgba(0,0,0,0.5);
      padding: 2px 6px;
      border-radius: 2px;
    }

    .cyber-button__glitch {
      position: absolute; top: 0; left: 0;
      width: 100%; height: 100%;
      background: linear-gradient(45deg, var(--primary), var(--secondary), var(--primary));
      opacity: 0; z-index: -1;
      transition: opacity 0.3s;
    }

    .cyber-button:hover .cyber-button__glitch {
      opacity: 0.1;
    }

    .back-link {
      display: block;
      margin: 40px auto 0;
      width: fit-content;
      padding: 12px 30px;
      color: white;
      border: 1px solid var(--primary);
      background: rgba(0,0,0,0.5);
      text-decoration: none;
      border-radius: 3px;
      transition: all 0.3s;
      box-shadow: 0 0 10px rgba(0,255,255,0.3);
    }

    .back-link:hover {
      background: rgba(0,255,255,0.1);
      box-shadow: var(--neon-glow);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>🛠️ أدوات Medo</h1>

    <div class="tools-list">
      <a href="https://medo419.github.io/medo//./debs//wicked.3.0b10.arm64e.deb" target="_blank" class="cyber-button">
        <span class="cyber-button__glitch"></span>
        <span class="cyber-button__tag">#1</span>
        سناب بلس Wicked
      </a>
      <a href="https://medo419.github.io/medo//./debs//FridaCodeManager.2.0~alpha5.arm64e.deb" target="_blank" class="cyber-button">
        <span class="cyber-button__glitch"></span>
        <span class="cyber-button__tag">#2</span>
        FridaCodeManager
      </a>
      <a href="https://medo419.github.io/medo//./debs//com.exile90.icleanerpro_7.10.0_iphoneos-arm64e.deb" target="_blank" class="cyber-button">
        <span class="cyber-button__glitch"></span>
        <span class="cyber-button__tag">#3</span>
        iCleaner Pro
      </a>
      <a href="https://medo419.github.io/medo//./debs//Filza.File.Manager.64-bit.4.0.1-4.arm64.deb" target="_blank" class="cyber-button">
        <span class="cyber-button__glitch"></span>
        <span class="cyber-button__tag">#4</span>
        Filza File Manager
      </a>
      <a href="https://medo419.github.io/medo//./debs//dev.objcmsgsend.iota_5.3.2_iphoneos-arm.deb" target="_blank" class="cyber-button">
        <span class="cyber-button__glitch"></span>
        <span class="cyber-button__tag">#5</span>
        سناب بلس iot
      </a>
    </div>

    <a href="index.html" class="back-link">⬅ العودة للرئيسية</a>
  </div>
</body>
</html>
